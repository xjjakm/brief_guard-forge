plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.0-r9'
group = 'cn.blockforge.generated.briefguard'
base { archivesName = 'brief_guard' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'brief_guard', mod_name: '内裤防具与装备系统', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
